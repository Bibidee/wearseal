name: wearseal-ci
on: [push,pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: python -m pytest -q tests/contract
      - run: python -m py_compile contracts/wearseal_agreement.py contracts/wearseal_vault.py
      - run: genvm-lint lint contracts/wearseal_agreement.py && genvm-lint lint contracts/wearseal_vault.py
